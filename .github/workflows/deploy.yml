name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Confidential-term deny-list for the leak tests; kept out of git on purpose.
      CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          build-cmd: npm run check && npm run build && npm test
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
